<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Student Management System'">Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark no-print">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎓 Student Management</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/students}">Students</a>
            <a class="nav-link" th:href="@{/subjects}">Subjects</a>
            <a class="nav-link" th:href="@{/marks}">Marks Entry</a>
            <a class="nav-link" th:href="@{/reports/class}">Reports</a>
        </div>
    </div>
</nav>
<div th:fragment="alerts">
    <div class="alert alert-success alert-dismissible fade show no-print" th:if="${success}">
        <span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show no-print" th:if="${error}">
        <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
</body>
</html>
