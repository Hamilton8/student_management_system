<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container py-4" style="max-width: 760px;">
    <h2 class="mb-3" th:text="${title}">Add Student</h2>
    <form th:action="@{/students/save}" th:object="${student}" method="post" class="card card-body shadow-sm" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Roll Number</label>
                <input class="form-control" th:field="*{rollNumber}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{rollNumber}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Course</label>
                <input class="form-control" th:field="*{course}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{course}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input class="form-control" th:field="*{firstName}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{firstName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input class="form-control" th:field="*{lastName}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{lastName}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input class="form-control" th:field="*{phone}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" th:field="*{dateOfBirth}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
            </div>
        </div>
        <div class="mt-4">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/students}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
