<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Students</h2>
        <a class="btn btn-primary" th:href="@{/students/new}">+ Add Student</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/students}" method="get">
        <div class="col-md-6">
            <input type="text" name="keyword" class="form-control" th:value="${keyword}"
                   placeholder="Search by roll number, name or course">
        </div>
        <div class="col-auto">
            <button class="btn btn-secondary" type="submit">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/students}">Reset</a>
        </div>
    </form>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr><th>Roll No</th><th>Name</th><th>Email</th><th>Phone</th><th>DOB</th><th>Course</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${students}">
                <td th:text="${s.rollNumber}"></td>
                <td th:text="${s.fullName}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.phone}"></td>
                <td th:text="${s.dateOfBirth != null} ? ${#temporals.format(s.dateOfBirth, 'dd MMM yyyy')} : ''"></td>
                <td th:text="${s.course}"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-success" th:href="@{/reports/student/{id}(id=${s.id})}">Report</a>
                    <a class="btn btn-sm btn-outline-info" th:href="@{/marks(studentId=${s.id})}">Marks</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/students/edit/{id}(id=${s.id})}">Edit</a>
                    <form class="d-inline" th:action="@{/students/{id}/delete(id=${s.id})}" method="post"
                          onsubmit="return confirm('Delete this student and all their marks?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="7" class="text-center text-muted py-4">No students found.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
